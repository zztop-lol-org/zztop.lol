name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick target project
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "project=zztop-lol"     >> "$GITHUB_OUTPUT"   # -> zztop.lol (production)
          else
            echo "project=zztop-lol-dev" >> "$GITHUB_OUTPUT"   # -> dev.zztop.lol (staging)
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ steps.target.outputs.project }} --branch=${{ github.ref_name }}
