<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zztop</title>
  <link rel="preload" href="fonts/montserrat-800-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* self-hosted so the real font is ready on first paint — no CDN swap flash.
       display:block keeps text invisible (never a fallback) until it loads. */
    @font-face {
      font-family: "Montserrat";
      font-style: normal;
      font-weight: 800;
      font-display: block;
      src: url("fonts/montserrat-800-latin.woff2") format("woff2");
    }
    :root { color-scheme: dark; --green: #7CFFB0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: auto; }
    body {
      background: #0a0a0f;
      color: var(--green);
      font-family: "Montserrat", ui-sans-serif, system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* tall scene gives us scroll distance; the stage is pinned in the middle.
       the animation runs in the first chunk, the rest holds the finished grid */
    .scene { height: 700vh; position: relative; }
    .stage {
      position: sticky;
      top: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .word {
      font-size: clamp(1.1rem, 6.8vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
      user-select: none;
      text-shadow: 0 0 0.35em rgba(124, 255, 176, 0.4);
      line-height: 1;
      /* stay hidden until the font is ready, then fade in once — never a fallback swap */
      opacity: 0;
      transition: opacity 0.28s ease;
    }
    body.fonts-ready .word { opacity: 1; }
    .word span { display: inline-block; will-change: transform, opacity, filter; }

    /* the pivot reserves the "n" slot; z overlays are absolute so they never
       shift the layout — the n stays exactly where it was */
    .pivot { position: relative; }
    .pivot .n-glyph { display: inline-block; }
    .pivot .z-glyph,
    .pivot .zside {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
    }

    /* link rows sit on the SAME monospace grid as the Z's — one char per cell,
       same size, columns aligned underneath (the ZZ lines up with the Z's) */
    .pivot .linkrow {
      position: absolute;
      left: 50%;
      top: 50%;
      display: flex;
      white-space: nowrap;
      color: var(--green);
      text-decoration: none;
      text-shadow: 0 0 0.35em rgba(124, 255, 176, 0.4);
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
      transition: text-shadow 0.2s ease, filter 0.2s ease;
    }
    .pivot .linkrow .cell { display: inline-block; text-align: center; }
    .pivot .linkrow:hover {
      text-shadow: 0 0 0.8em rgba(124, 255, 176, 0.9);
      filter: brightness(1.15);
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 6vh;
      transform: translateX(-50%);
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.6;
      animation: bob 2.2s ease-in-out infinite;
      will-change: transform, opacity;
    }
    @keyframes bob {
      0%, 100% { transform: translate(-50%, 0); }
      50%      { transform: translate(-50%, 6px); }
    }

    /* final panel: ZZTOP + fat up arrow, a back-to-top that replays the scroll */
    .footer {
      height: 100vh;
      display: grid;
      place-items: center;
    }
    .backtop {
      appearance: none;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      font-family: inherit;   /* buttons don't inherit the font — force Montserrat */
      color: var(--green);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15em;
      font-size: clamp(1.1rem, 6.8vw, 5rem);   /* same size as the Z row */
      text-shadow: 0 0 0.35em rgba(124, 255, 176, 0.4);
      transition: filter 0.2s ease, transform 0.2s ease;
    }
    .backtop .arrow {
      width: 0.78em;
      height: 0.78em;
      display: block;
      filter: drop-shadow(0 0 0.18em rgba(124, 255, 176, 0.45));
    }
    .backtop .zztop {
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .backtop:hover { filter: brightness(1.15); transform: translateY(-4px); }
    .backtop:active { transform: translateY(-1px); }

    @media (prefers-reduced-motion: reduce) {
      .hint { animation: none; }
      .backtop { transition: none; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="stage">
      <div class="word" id="word" aria-label="injective">
        <span data-l>I</span><span class="pivot" id="pivot"><span class="n-glyph" id="nGlyph">N</span><span class="z-glyph" id="zGlyph">Z</span></span><span data-l>J</span><span data-l>E</span><span data-l>C</span><span data-l>T</span><span data-l>I</span><span data-l>V</span><span data-l>E</span>
      </div>
    </div>
  </div>
  <footer class="footer">
    <button class="backtop" id="backtop" aria-label="Back to top">
      <svg class="arrow" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <line x1="50" y1="90" x2="50" y2="24" stroke="currentColor" stroke-width="16"
              stroke-linecap="round" />
        <polyline points="16,54 50,18 84,54" stroke="currentColor" stroke-width="16"
                  stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="zztop">ZZTOP</span>
    </button>
  </footer>

  <div class="hint" id="hint">zzscroll ↓</div>

  <script>
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    // normalize v into 0..1 across [a,b]
    const seg = (v, a, b) => clamp((v - a) / (b - a), 0, 1);
    const smooth = (t) => t * t * (3 - 2 * t);

    const scene  = document.querySelector(".scene");
    const word   = document.getElementById("word");
    const pivot  = document.getElementById("pivot");
    const nGlyph = document.getElementById("nGlyph");
    const zGlyph = document.getElementById("zGlyph");
    const hint   = document.getElementById("hint");

    // every letter except the pivot "n"
    const letters = [...word.querySelectorAll("span[data-l]")];

    // ---- the sleeping Z row: 10 Z's (same length as ZZTELEGRAM), pivot in the middle ----
    const LEFT = 4, RIGHT = 5;   // Z's added left / right of the morphed pivot Z (+1 pivot = 10)
    const GAP = 0.95;            // monospace pitch shared by the Z's and the link rows, in em
    const sides = [];
    const addSide = (dir, k) => {
      const el = document.createElement("span");
      el.className = "zside";
      el.textContent = "Z";
      pivot.appendChild(el);
      sides.push({ el, dir, k });
    };
    for (let k = 1; k <= LEFT; k++)  addSide(-1, k);
    for (let k = 1; k <= RIGHT; k++) addSide(1, k);

    // ---- link rows on the same grid, left-aligned under the leftmost Z ----
    const ROWGAP = 1.2;          // vertical spacing between rows, in em
    // stacked ABOVE the Z row, lexicographic top-to-bottom: ZZCHART, ZZTELEGRAM, ZZZZ...
    // ZZTELEGRAM (row -1) appears first, ZZCHART (row -2) appears above it next.
    const LINKS = [
      { text: "ZZX",        href: "https://x.com/zztoplol",                row: -1, order: 0 },
      { text: "ZZTELEGRAM", href: "https://t.me/zztop_lol",               row: -2, order: 1 },
      { text: "ZZCHART",    href: "https://pump.trippyinj.xyz/launch/382", row: -3, order: 2 },
    ];
    const linkRows = LINKS.map((L) => {
      const a = document.createElement("a");
      a.className = "linkrow";
      a.href = L.href; a.target = "_blank"; a.rel = "noopener";
      a.setAttribute("aria-label", L.text.toLowerCase());
      for (const ch of L.text) {
        const c = document.createElement("span");
        c.className = "cell";
        c.style.width = GAP + "em";
        c.setAttribute("aria-hidden", "true");
        c.textContent = ch;
        a.appendChild(c);
      }
      pivot.appendChild(a);
      const centerCol = -LEFT + (L.text.length - 1) / 2;   // left-aligned at col -LEFT
      return { a, centerCol, row: L.row, order: L.order };
    });

    // widest column the block reaches, used to center the whole thing on screen
    const rightmostCol = Math.max(RIGHT, ...LINKS.map((L) => -LEFT + (L.text.length - 1)));
    const blockCenterCol = (-LEFT + rightmostCol) / 2;

    // the whole animation plays within the first ANIM_END of the scroll; past that
    // the finished grid just holds, centered, so a fast scroll can't skip the links
    const ANIM_END = 0.75;

    let progress = 0, ticking = false, nOffset = 0;

    function measure() {
      // land the pivot so the whole grid block (Z row + link rows) is centered
      const prev = word.style.transform;
      word.style.transform = "none";
      const r = pivot.getBoundingClientRect();
      const fontPx = parseFloat(getComputedStyle(word).fontSize) || 16;
      const pitchPx = GAP * fontPx;
      nOffset = (window.innerWidth / 2 - blockCenterCol * pitchPx) - (r.left + r.width / 2);
      word.style.transform = prev;
    }

    function computeProgress() {
      const scrollable = scene.offsetHeight - window.innerHeight;
      progress = scrollable > 0 ? clamp(window.scrollY / scrollable, 0, 1) : 0;
    }

    function render() {
      // remap real scroll into animation space; clamps to 1 during the hold tail
      const p = Math.min(progress / ANIM_END, 1);

      // hint fades out as soon as you start scrolling
      hint.style.opacity = (0.6 * (1 - seg(p, 0.0, 0.06))).toFixed(3);

      // --- Phase A: fade "injective" away, keep the n in place (0 -> 0.28) ---
      // outer letters leave first for a gentle dissolve inward
      const maxD = 8;
      letters.forEach((el) => {
        const idx = [...word.children].indexOf(el);
        const d = Math.abs(idx - 1);                 // distance from the n (index 1)
        const start = 0.02 + (1 - d / maxD) * 0.10;  // outer = earlier
        const t = smooth(seg(p, start, start + 0.16));
        el.style.opacity = (1 - t).toFixed(3);
        el.style.transform = `translateY(${(-0.12 * t).toFixed(3)}em)`;
        el.style.filter = t > 0 ? `blur(${(3 * t).toFixed(2)}px)` : "none";
      });

      // --- Phase B: rotate the n 90° right, morph it into an upright z (0.30 -> 0.52) ---
      const rot = 90 * smooth(seg(p, 0.30, 0.44));
      const nOut = smooth(seg(p, 0.40, 0.52));
      const zIn  = smooth(seg(p, 0.40, 0.52));
      nGlyph.style.transform = `rotate(${rot.toFixed(2)}deg)`;
      nGlyph.style.opacity = (1 - nOut).toFixed(3);
      zGlyph.style.opacity = zIn.toFixed(3);
      zGlyph.style.transform = `translate(-50%, -50%) scale(${(0.8 + 0.2 * zIn).toFixed(3)})`;

      // --- Phase C: the z multiplies, spreading left and right (0.50 -> 0.74) ---
      // glide the block to screen center, and lift it as the links settle in below
      const recenter = smooth(seg(p, 0.50, 0.74));
      const settle = smooth(seg(p, 0.74, 0.94));   // drop the group so the rows above balance
      word.style.transform =
        `translate(${(nOffset * recenter).toFixed(2)}px, ${(1.8 * settle).toFixed(3)}em)`;

      sides.forEach(({ el, dir, k }) => {
        const start = 0.50 + (k - 1) * 0.03;         // inner z's spread first
        const t = smooth(seg(p, start, Math.min(start + 0.18, 0.74)));
        const x = dir * t * k * GAP;                 // outward offset in em
        el.style.opacity = t.toFixed(3);
        el.style.transform =
          `translate(-50%, -50%) translateX(${x.toFixed(3)}em) scale(${(0.7 + 0.3 * t).toFixed(3)})`;
      });

      // --- Phase D: link rows rise into place ABOVE the Z row (0.77 -> 0.97) ---
      linkRows.forEach((L) => {
        const start = 0.74 + L.order * 0.05;         // ZZX first, then ZZTELEGRAM, then ZZCHART
        const t = smooth(seg(p, start, start + 0.14));
        const y = L.row * ROWGAP + (1 - t) * 0.6;    // rise up into place
        L.a.style.opacity = t.toFixed(3);
        L.a.style.transform =
          `translate(-50%, -50%) translate(${(L.centerCol * GAP).toFixed(3)}em, ${y.toFixed(3)}em)`;
        L.a.style.pointerEvents = t > 0.6 ? "auto" : "none";
      });

      ticking = false;
    }

    function onScroll() {
      computeProgress();
      if (!ticking) { ticking = true; requestAnimationFrame(render); }
    }

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", () => { measure(); computeProgress(); render(); });
    measure();
    computeProgress();
    render();

    // reveal the word only once Montserrat is decoded, so it never swaps in.
    // re-measure first: proportional metrics differ from the fallback font.
    const reveal = () => {
      measure();
      computeProgress();
      render();
      document.body.classList.add("fonts-ready");
    };
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(reveal);
      setTimeout(reveal, 3500); // safety net if the font never resolves
    } else {
      reveal();
    }

    // ZZTOP: smooth-scroll back to the top so the whole animation plays in
    // reverse — quick but visible. Fixed duration = consistent "regular speed".
    const backtop = document.getElementById("backtop");
    const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    let scrolling = false;
    function scrollToTop(duration = 1500) {
      const startY = window.scrollY;
      if (startY <= 0 || scrolling) return;
      scrolling = true;
      const startT = performance.now();
      const stepTo = (now) => {
        const t = Math.min(1, (now - startT) / duration);
        window.scrollTo(0, Math.round(startY * (1 - easeInOut(t))));
        if (t < 1) requestAnimationFrame(stepTo);
        else scrolling = false;
      };
      requestAnimationFrame(stepTo);
    }
    backtop.addEventListener("click", () => scrollToTop());
  </script>
</body>
</html>
