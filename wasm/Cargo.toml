[package]
name = "zzsearch"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = true
