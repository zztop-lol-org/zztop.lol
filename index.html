<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zzz</title>
  <meta name="description" content="zzzzzzzzzz" />
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      background: #0a0a0f;
      color: #e8e8f0;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      overflow: hidden;
      cursor: pointer;
    }
    .zzz {
      font-size: clamp(3rem, 18vw, 16rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
      user-select: none;
      color: #7CFFB0;
      text-shadow: 0 0 0.35em rgba(124, 255, 176, 0.45);
    }
    /* characters still scrambling get a slightly dimmer green "decrypting" tint */
    .zzz .scrambling {
      color: #7CFFB0;
      opacity: 0.8;
    }
    .zzz.done {
      /* start at the bright state (matches the just-finished text) so the
         pulse eases down smoothly with no jump */
      animation: breathe 4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 1;    transform: scale(1); }
      50%      { opacity: 0.65; transform: scale(0.992); }
    }
    @media (prefers-reduced-motion: reduce) {
      .zzz { animation: none !important; opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="zzz" aria-label="zzzzzzzzzz"></main>

  <script>
    const TARGET = "zzzzzzzzzz";
    const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!<>-_\\/[]{}=+*^?#@%&";
    const el = document.querySelector(".zzz");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const rand = (n) => Math.floor(Math.random() * n);
    const glyph = () => GLYPHS[rand(GLYPHS.length)];

    let raf = null;

    function scramble() {
      if (reduce) { el.textContent = TARGET; el.classList.add("done"); return; }
      if (raf) cancelAnimationFrame(raf);
      el.classList.remove("done");

      // Each character locks in after a staggered start, flipping through random
      // glyphs while it's still "encrypted".
      const queue = TARGET.split("").map((ch, i) => ({
        to: ch,
        start: i * 5 + rand(6),        // frames before it starts settling
        end:   i * 5 + rand(6) + 22,   // frames until it locks to final char
        cur: glyph(),
      }));

      let frame = 0;
      const tick = () => {
        let done = 0;
        let html = "";
        for (const c of queue) {
          if (frame >= c.end) {
            done++;
            html += c.to;
          } else if (frame >= c.start) {
            if (frame % 2 === 0) c.cur = glyph();
            html += `<span class="scrambling">${c.cur}</span>`;
          } else {
            html += `<span class="scrambling">${glyph()}</span>`;
          }
        }
        el.innerHTML = html;
        frame++;
        if (done === queue.length) {
          el.textContent = TARGET;
          el.classList.add("done");
          raf = null;
          return;
        }
        raf = requestAnimationFrame(tick);
      };
      tick();
    }

    scramble();
    // Replay on click / tap.
    document.body.addEventListener("click", scramble);
  </script>
</body>
</html>
