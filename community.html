<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- this page talks to our own /api, so connect-src 'self' (unlike /address) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>zztop — community x</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/icons/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="canonical" href="https://zztop.lol/community" />
  <meta property="og:title" content="zztop — community x" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://zztop.lol/community" />
  <meta property="og:image" content="https://zztop.lol/icons/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://zztop.lol/icons/og.png" />
  <script>
    (function () {
      var t = function (n) { return n === "traverse" ? "zz-back" : "zz-forward"; };
      addEventListener("pageswap", function (e) { if (e.viewTransition && e.activation) e.viewTransition.types.add(t(e.activation.navigationType)); });
      addEventListener("pagereveal", function (e) { if (e.viewTransition && window.navigation && navigation.activation) e.viewTransition.types.add(t(navigation.activation.navigationType)); });
    })();
  </script>
  <link rel="preload" href="/fonts/montserrat-800-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/montserrat-300-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family: "Montserrat"; font-weight: 800; font-display: block; src: url("/fonts/montserrat-800-latin.woff2") format("woff2"); }
    @font-face { font-family: "Montserrat"; font-weight: 300; font-display: block; src: url("/fonts/montserrat-300-latin.woff2") format("woff2"); }
    :root { color-scheme: dark; --green: #7CFFB0; --dim: #3f6b53; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100dvh; background: #0a0a0f; color: var(--green); font-family: "Montserrat", ui-sans-serif, system-ui, sans-serif; overflow-x: hidden; }
    .topbar { position: sticky; top: 0; padding: 1.2rem clamp(1rem, 4vw, 2.5rem); }
    .zzback { display: inline-flex; align-items: center; gap: .5em; font-weight: 800; font-size: clamp(1rem,3.2vw,1.5rem); letter-spacing: .04em; color: var(--green); text-decoration: none; text-shadow: 0 0 .4em rgba(124,255,176,.4); }
    .zzback .arrow { width: 1em; height: .78em; display: block; }
    main { min-height: calc(100dvh - 5rem); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem; padding: 1rem 1.2rem 7rem; text-align: center; }
    .title { font-weight: 800; font-size: clamp(1.8rem,8vw,4.2rem); letter-spacing: .03em; line-height: 1; text-shadow: 0 0 .35em rgba(124,255,176,.4); }
    .sub { font-weight: 300; font-size: .95rem; color: var(--dim); max-width: 26em; }
    .box { width: 100%; max-width: 34rem; display: flex; flex-direction: column; gap: 1rem; }
    button { font-family: inherit; cursor: pointer; }
    .connect { font-weight: 800; font-size: 1.2rem; color: #0a0a0f; background: var(--green); border: 0; border-radius: .5rem; padding: .6em 1.1em; box-shadow: 0 0 1.4em rgba(124,255,176,.3); }
    .who { font-weight: 300; font-size: .85rem; color: var(--dim); word-break: break-all; min-height: 1.2em; }
    .picker { display: flex; flex-direction: column; gap: .6rem; }
    .picker button { display: flex; align-items: center; gap: .7rem; justify-content: center; font-family: inherit; font-weight: 800; font-size: 1rem; color: var(--green); background: transparent; border: 2px solid var(--green); border-radius: .5rem; padding: .6em 1em; }
    .picker button:hover { background: var(--green); color: #0a0a0f; }
    .picker img { width: 1.4em; height: 1.4em; border-radius: .3em; }
    .disconnect { background: transparent; border: 0; color: var(--dim); font-family: inherit; font-weight: 300; font-size: .85rem; text-decoration: underline; cursor: pointer; }
    .disconnect:hover { color: var(--green); }
    textarea { width: 100%; min-height: 6.5rem; resize: vertical; background: #12121a; color: var(--green); border: 2px solid #223; border-radius: .6rem; padding: .8rem; font-family: inherit; font-size: 1.05rem; }
    textarea:focus { outline: none; border-color: var(--green); }
    .row { display: flex; align-items: center; gap: .6rem; font-weight: 300; font-size: .9rem; color: var(--dim); }
    .file { background: transparent; border: 0; padding: 0; color: var(--dim); font-family: inherit; font-weight: 300; font-size: .9rem; cursor: pointer; text-decoration: underline; }
    .file:hover { color: var(--green); }
    .fileclear { background: transparent; border: 0; padding: 0; color: var(--dim); font-family: inherit; cursor: pointer; font-size: .9rem; }
    .fileclear:hover { color: #ff6b8a; }
    /* fixed-width, right-aligned, tabular so the changing count never shifts the row */
    .count { margin-left: auto; min-width: 4.6em; text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
    .count.over { color: #ff6b8a; }
    .post { margin-top: 1.4rem; font-weight: 800; font-size: 1.5rem; letter-spacing: .04em; color: #0a0a0f; background: var(--green); border: 0; border-radius: .5rem; padding: .5em 1.1em; box-shadow: 0 0 1.4em rgba(124,255,176,.3); }
    .post:disabled { opacity: .4; cursor: not-allowed; }
    .msg { min-height: 1.4em; font-weight: 300; font-size: .95rem; }
    .msg a { color: var(--green); text-decoration: underline; font-weight: 800; }
    .msg.ok { color: var(--green); } .msg.err { color: #ff6b8a; }
    .hidden { display: none; }
    .walletbar { position: fixed; left: 0; right: 0; bottom: 1.2rem; display: flex; flex-direction: column; align-items: center; gap: .7rem; padding: 0 1rem; }
    .walletbar .who { max-width: 90vw; }
    @view-transition { navigation: auto; }
    @keyframes zz-out-left { to { transform: translateX(-100%); } } @keyframes zz-in-right { from { transform: translateX(100%); } }
    @keyframes zz-out-right { to { transform: translateX(100%); } } @keyframes zz-in-left { from { transform: translateX(-100%); } }
    ::view-transition-old(root),::view-transition-new(root){animation-duration:.42s;animation-timing-function:cubic-bezier(.4,0,.2,1);}
    html:active-view-transition-type(zz-forward)::view-transition-old(root){animation-name:zz-out-left;}
    html:active-view-transition-type(zz-forward)::view-transition-new(root){animation-name:zz-in-right;}
    html:active-view-transition-type(zz-back)::view-transition-old(root){animation-name:zz-out-right;}
    html:active-view-transition-type(zz-back)::view-transition-new(root){animation-name:zz-in-left;}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="zzback" href="/" id="zzback">
      <svg class="arrow" viewBox="0 0 100 70" fill="none" aria-hidden="true">
        <line x1="18" y1="35" x2="92" y2="35" stroke="currentColor" stroke-width="14" stroke-linecap="round" />
        <polyline points="46,10 16,35 46,60" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      </svg><span>ZZBACK</span>
    </a>
  </header>

  <main>
    <h1 class="title">ZZXCOMMUNITY</h1>

    <div class="box">
      <div id="composer" class="hidden">
        <textarea id="text" maxlength="280" placeholder="what's the zz vibe today?"></textarea>
        <div class="row">
          <button type="button" class="file" id="fileBtn">attach image / video</button>
          <button type="button" class="fileclear hidden" id="fileClear" aria-label="remove file">✕</button>
          <span class="count" id="count">0/280</span>
          <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp,video/mp4" hidden />
        </div>
        <button class="post" id="post">ZZPOST</button>
      </div>

      <div class="msg" id="msg"></div>
    </div>
    <footer class="walletbar" id="walletbar">
      <button class="connect" id="connect">CONNECT WALLET</button>
      <div class="picker hidden" id="picker"></div>
      <div class="who" id="who"></div>
      <button class="disconnect hidden" id="disconnect">disconnect wallet</button>
    </footer>
  </main>

  <script>
    document.getElementById("zzback").addEventListener("click", function (e) { if (history.length > 1) { e.preventDefault(); history.back(); } });
  </script>
  <script>
  (function () {
    var MAX_MEDIA = 18 * 1024 * 1024;
    var $ = function (id) { return document.getElementById(id); };
    var connectBtn = $("connect"), picker = $("picker"), who = $("who"), disconnectBtn = $("disconnect"),
        composer = $("composer"), textEl = $("text"), fileEl = $("file"), fileBtn = $("fileBtn"), fileClear = $("fileClear"),
        countEl = $("count"), postBtn = $("post"), msg = $("msg");
    function shortName(n) { return n.length > 26 ? n.slice(0, 14) + "…" + n.slice(-8) : n; }
    function clearFile() { fileEl.value = ""; fileBtn.textContent = "attach image / video"; fileClear.classList.add("hidden"); }
    fileBtn.addEventListener("click", function () { fileEl.click(); });
    fileClear.addEventListener("click", clearFile);
    fileEl.addEventListener("change", function () {
      if (fileEl.files[0]) { fileBtn.textContent = shortName(fileEl.files[0].name); fileClear.classList.remove("hidden"); }
      else clearFile();
    });
    var account = null, selectedProvider = null, currentName = null;
    var STORE = "zz_wallet";
    function saveWallet(id) { try { localStorage.setItem(STORE, id || ""); } catch (e) {} }
    function loadWallet() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
    function forgetWallet() { try { localStorage.removeItem(STORE); } catch (e) {} }
    var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

    // EIP-6963: discover every injected EVM wallet (MetaMask, Rabby, Keplr-EVM, ...)
    var discovered = {};
    window.addEventListener("eip6963:announceProvider", function (e) {
      var d = e.detail;
      if (d && d.info && d.provider) discovered[d.info.rdns || d.info.uuid || d.info.name] = d;
    });
    function requestProviders() { window.dispatchEvent(new Event("eip6963:requestProvider")); }
    requestProviders();

    function providerList() {
      var list = Object.keys(discovered).map(function (k) { return discovered[k]; });
      if (!list.length && window.ethereum) {
        var e = window.ethereum;
        var name = e.isRabby ? "Rabby" : e.isMetaMask ? "MetaMask" : e.isKeplr ? "Keplr" : "Injected wallet";
        list = [{ info: { name: name }, provider: e }];
      }
      return list;
    }
    function setMsg(t, cls) { msg.textContent = t; msg.className = "msg " + (cls || ""); }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function setMsgHTML(html, cls) { msg.innerHTML = html; msg.className = "msg " + (cls || ""); }

    textEl.addEventListener("input", function () {
      var n = [...textEl.value].length;
      countEl.textContent = n + "/280";
      countEl.classList.toggle("over", n > 280);
    });

    function showConnected() {
      who.textContent = "connected: " + account + (currentName ? "  ·  " + currentName : "");
      connectBtn.classList.add("hidden");
      picker.classList.add("hidden");
      disconnectBtn.classList.remove("hidden");
      composer.classList.remove("hidden");
      setMsg("");
    }
    function resetConnection() {
      account = null; selectedProvider = null; currentName = null; forgetWallet();
      who.textContent = "";
      disconnectBtn.classList.add("hidden");
      composer.classList.add("hidden");
      picker.classList.add("hidden");
      connectBtn.classList.remove("hidden");
    }
    function bindAccountEvents(prov) {
      if (prov && prov.on && !prov.__zzBound) {
        prov.__zzBound = true;
        prov.on("accountsChanged", function (accts) {
          if (!accts || !accts.length) resetConnection();      // locked / revoked
          else { account = accts[0]; showConnected(); }         // switched account
        });
      }
    }
    function backToConnect() { picker.classList.add("hidden"); connectBtn.classList.remove("hidden"); }
    async function connectWith(entry, silent) {
      try {
        // single request per user gesture — a second provider.request here breaks
        // mobile in-app browsers (Brave) that gate the first interaction behind a prompt
        var accts = await entry.provider.request({ method: silent ? "eth_accounts" : "eth_requestAccounts" });
        if (!accts || !accts.length) { if (!silent) { setMsg("no account authorized", "err"); backToConnect(); } return false; }
        account = accts[0]; selectedProvider = entry.provider; currentName = entry.info.name || "wallet";
        saveWallet(entry.info.rdns || entry.info.name || "");
        bindAccountEvents(entry.provider);
        showConnected();
        return true;
      } catch (e) { if (!silent) { setMsg("connection cancelled", "err"); backToConnect(); } return false; }
    }

    connectBtn.addEventListener("click", async function () {
      requestProviders();
      await sleep(200); // let wallets announce
      var list = providerList();
      if (!list.length) { setMsg("no wallet found — install MetaMask, Rabby, or enable Keplr EVM", "err"); return; }
      // always show the selection so disconnect -> reconnect lets you pick wallet/account
      picker.innerHTML = "";
      list.forEach(function (entry) {
        var b = document.createElement("button");
        if (entry.info.icon) { var im = document.createElement("img"); im.src = entry.info.icon; im.alt = ""; b.appendChild(im); }
        var span = document.createElement("span"); span.textContent = entry.info.name || "wallet"; b.appendChild(span);
        b.addEventListener("click", function () { connectWith(entry); });
        picker.appendChild(b);
      });
      connectBtn.classList.add("hidden");
      picker.classList.remove("hidden");
      setMsg("choose a wallet");
    });

    disconnectBtn.addEventListener("click", resetConnection);

    // silent restore across reloads (only if the wallet still authorizes us)
    (async function restore() {
      var id = loadWallet(); if (!id) return;
      requestProviders();
      await sleep(300);
      var list = providerList();
      var entry = list.filter(function (e) { return (e.info.rdns || e.info.name) === id; })[0] || (list.length === 1 ? list[0] : null);
      if (entry) await connectWith(entry, true);
    })();

    function readFile(f) {
      return new Promise(function (res, rej) {
        var r = new FileReader();
        r.onload = function () { var m = /^data:([^;]+);base64,(.*)$/.exec(r.result); res(m ? { type: m[1], data: m[2] } : null); };
        r.onerror = rej; r.readAsDataURL(f);
      });
    }

    postBtn.addEventListener("click", async function () {
      if (!account) return;
      var text = textEl.value.trim();
      if (!text) { setMsg("write something first", "err"); return; }
      if ([...text].length > 280) { setMsg("too long", "err"); return; }
      var media = null;
      if (fileEl.files[0]) {
        if (fileEl.files[0].size > MAX_MEDIA) { setMsg("media too large (max 18MB)", "err"); return; }
        media = await readFile(fileEl.files[0]);
      }
      postBtn.disabled = true; setMsg("sign in your wallet…");
      try {
        var ts = Math.floor(Date.now() / 1000);
        var message = "zzzz confirming it's you\n" + ts;
        var signature = await selectedProvider.request({ method: "personal_sign", params: [message, account] });
        setMsg("checking ZZ + submitting…");
        var res = await fetch("/api/submit", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ address: account, signature: signature, ts: ts, text: text, media: media }),
        });
        var j = await res.json().catch(function () { return {}; });
        if (res.ok && j.ok) { setMsg("✅ submitted for review — the zztop crew will approve it", "ok"); textEl.value = ""; clearFile(); countEl.textContent = "0/280"; countEl.classList.remove("over"); }
        else {
          var err = j.error || "submit failed";
          if (res.status === 403) setMsgHTML("✗ " + esc(err) + ' — <a href="https://pump.trippyinj.xyz/launch/382" target="_blank" rel="noopener">buy ZZ here</a>', "err");
          else setMsg("✗ " + err, "err");
        }
      } catch (e) { setMsg("✗ " + (e.message || "signing cancelled"), "err"); }
      postBtn.disabled = false;
    });
  })();
  </script>
</body>
</html>
